[versions]
kotlin = "2.2.0"
junit = "4.13.2"
vanniktech = "0.37.0"
kover = "0.8.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin_test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

[plugins]
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
